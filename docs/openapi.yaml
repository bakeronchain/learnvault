      summary: Submit an appeal for a rejected milestone
      description: >
        The authenticated scholar submits an appeal for a rejected milestone
        report. Only the report owner can appeal, and only when the report
        status is "rejected". One appeal per report (status transitions to
        "appealed").
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Milestone report ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 2000
                  description: Explanation of why the scholar is appealing the rejection
      responses:
        "200":
          description: Appeal submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reportId:
                        type: integer
                      status:
                        type: string
