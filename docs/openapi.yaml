                  average_completion_rate:
                    type: number
                    format: float
                    description: Average milestone completion rate for scholars funded by this donor
                      (0-1)
                    example: 0.85
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Treasury contract not configured
  /api/enrollments:
    post:
      tags:
        - Enrollments
      summary: Create a new course enrollment
      security:
        - bearerAuth: []
      description: |
        Records a course enrollment in the database after validating
        the on-chain enrollment via the CourseMilestone contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - learner_address
                - course_id
                - tx_hash
              properties:
                learner_address:
                  type: string
                  description: The learner's Stellar wallet address
                course_id:
                  type: string
                  description: The course identifier (e.g., "stellar-basics")
                tx_hash:
                  type: string
                  description: The transaction hash of the on-chain enrollment
            example:
              learner_address: GABCD123456789...
              course_id: stellar-basics
              tx_hash: abc123def456
      responses:
        "201":
          description: Enrollment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment_id:
                    type: integer
                  enrolled_at:
                    type: string
                    format: date-time
        "400":
          description: Validation error or not enrolled on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "404":
          description: Course not found
        "409":
          description: Already enrolled in this course
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Enrollments
      summary: Get enrollments for a learner
      description: Returns all courses a learner is enrolled in
      parameters:
        - in: query
          name: learner_address
          required: true
          schema:
            type: string
          description: The learner's Stellar wallet address
      responses:
        "200":
          description: Enrollments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        enrollment_id:
                          type: integer
                        course_id:
                          type: string
                        tx_hash:
                          type: string
                        enrolled_at:
                          type: string
                          format: date-time
        "400":
          description: Missing learner_address parameter
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/events:
    get:
      tags:
        - Events
      summary: List indexed on-chain events
      parameters:
        - in: query
          name: contract
          schema:
            type: string
          description: Contract ID filter
        - in: query
          name: type
          schema:
            type: string
          description: Event topic (LearnToken::Mint etc)
        - in: query
          name: address
          schema:
            type: string
          description: Address in event data
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        contract:
                          type: string
                        event_type:
                          type: string
                        data:
                          type: object
                        ledger_sequence:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        "500":
          description: Internal error
  /api/governance/proposals:
    get:
      tags:
        - Governance
      summary: List governance proposals
      description: Returns a paginated list of governance proposals, optionally
        filtered by status.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - approved
              - queued
              - rejected
          description: Filter proposals by status
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of proposals per page
      responses:
        "200":
          description: Paginated list of proposals
          content:
