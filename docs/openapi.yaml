  /api/courses/{idOrSlug}/translations/{languageCode}:
    get:
      tags:
        - Translations
      summary: Get the course translation editor state
      description: >
        Translator (granted for languageCode) or course-admin only. Returns the
        English source, any existing translation at any status, and the course's
        do-not-translate glossary — everything the side-by-side editor needs in
        one call.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: path
          name: languageCode
          required: true
          schema:
            type: string
            enum:
              - es
              - fr
              - sw
      responses:
        "200":
          description: Editor state
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      contentVersion:
                        type: integer
                  translation:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/CourseTranslation"
                  glossary:
                    type: array
                    items:
                      $ref: "#/components/schemas/GlossaryTerm"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
        - Translations
      summary: Save a course translation draft
      description: >
        Translator (granted for languageCode) or course-admin only. Upserts
        title/description as a draft and stamps source_version to the course's
        current content_version. Never changes an existing in_review/published
        status — only submit/publish do that.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: path
          name: languageCode
          required: true
          schema:
            type: string
            enum:
              - es
              - fr
              - sw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Saved translation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTranslation"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/courses/{idOrSlug}/translations/{languageCode}/submit:
    post:
      tags:
        - Translations
      summary: Submit a course translation for review
      description: Translator (granted for languageCode) or course-admin only. Moves
        draft (or stale) to in_review.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: path
          name: languageCode
          required: true
          schema:
            type: string
            enum:
              - es
              - fr
              - sw
      responses:
        "200":
          description: Submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTranslation"
        "400":
          description: No draft or stale translation available to submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/courses/{idOrSlug}/translations/{languageCode}/publish:
    post:
      tags:
        - Translations
      summary: Publish a course translation
      description: >
        Course-admin only — never a translator, regardless of language grant.
        Moves in_review to published, making it servable to learners. This is
        what guarantees a translator scoped to one language can never publish
        any language, including their own.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: path
          name: languageCode
          required: true
          schema:
            type: string
            enum:
              - es
              - fr
              - sw
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseTranslation"
        "400":
          description: No in_review translation available to publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
