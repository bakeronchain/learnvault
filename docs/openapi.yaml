              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/translations/queue:
    get:
      tags:
        - Translations
      summary: Translator queue for one language
      description: >
        Translator (granted for the requested language) or course-admin only.
        Three buckets: lessons with no translation row yet, submissions awaiting
        publish, and published/draft translations flagged stale because their
        English source changed. This is how a translator finds out a lesson they
        translated has gone stale — there is no push notification yet, so
        checking this queue is the supported workflow today.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: language
          required: true
          schema:
            type: string
            enum:
              - es
              - fr
              - sw
      responses:
        "200":
          description: Queue contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslatorQueue"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/treasury/stats:
    get:
      tags:
        - Treasury
      summary: Get treasury statistics
      description: Returns aggregated statistics including total deposits,
        disbursements, scholars funded, active proposals, and donor count
      responses:
        "200":
          description: Treasury statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_deposited_usdc:
                    type: string
                    description: Total USDC deposited (in stroops)
                    example: "125400000000"
                  total_disbursed_usdc:
                    type: string
                    description: Total USDC disbursed (in stroops)
                    example: "98200000000"
                  scholars_funded:
                    type: integer
                    description: Number of unique scholars funded
                    example: 128
                  active_proposals:
                    type: integer
                    description: Number of active scholarship proposals
                    example: 12
                  donors_count:
                    type: integer
                    description: Number of unique donors
                    example: 47
        "500":
          description: Internal server error
        "503":
          description: Treasury contract not configured
  /api/treasury/activity:
    get:
      tags:
        - Treasury
      summary: Get treasury activity feed
      description: Returns recent treasury events including deposits and disbursements
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of events to return
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of events to skip for pagination
      responses:
        "200":
          description: Treasury activity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - deposit
                            - disburse
                          example: deposit
                        amount:
                          type: string
                          description: Amount in stroops
                          example: "500000000"
                        address:
                          type: string
                          description: Donor address (for deposits)
                          example: GABC...
                        scholar:
                          type: string
                          description: Scholar address (for disbursements)
                          example: GDEF...
                        tx_hash:
                          type: string
                          description: Transaction hash
                          example: 018d4d55354a1d4f6726932712954d0f5b6797a0d58478a5e89f6a9d3451d3d8
                        created_at:
                          type: string
                          format: date-time
                          description: Event timestamp
        "500":
          description: Internal server error
        "503":
          description: Treasury contract not configured
  /api/upload:
    post:
      tags:
        - Upload
      summary: Pin a file to IPFS via Pinata
      description: >
        Accepts a single file (PDF, PNG, JPEG, MP4 — max 10 MB), pins it to IPFS
        via Pinata, and returns the CID and a Pinata gateway URL. Use this
        endpoint to upload proposal attachments, course cover images, and
        ScholarNFT images before referencing their CIDs elsewhere.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File pinned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid:
                    type: string
                    example: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                  gatewayUrl:
                    type: string
                    example: https://gateway.pinata.cloud/ipfs/bafybei...
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/upload/nft-metadata:
    post:
      tags:
        - Upload
      summary: Pin NFT metadata to IPFS
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Metadata pinned successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/profile/{address}:
    get:
      tags:
        - Profile
      summary: Get user profile
      description: Returns a user's rich profile including bio, avatar, social links,
        and stats.
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: User's Stellar wallet address
      responses:
        "200":
          description: User profile with stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/UserProfile"
                  stats:
                    $ref: "#/components/schemas/ProfileStats"
                  milestones:
                    type: object
                    properties:
                      completed:
                        type: integer
                      pending:
                        type: integer
                  credentials:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/profile:
    put:
      tags:
        - Profile
      summary: Update user profile
      description: Updates or creates the authenticated user's profile. Requires
        authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 100
                  nullable: true
                bio:
                  type: string
                  maxLength: 1000
                  nullable: true
                avatarUrl:
                  type: string
                  maxLength: 500
                  nullable: true
                avatarCid:
                  type: string
                  maxLength: 100
                  nullable: true
                socialLinks:
                  type: object
                  properties:
                    twitter:
                      type: string
                      maxLength: 200
                    github:
                      type: string
                      maxLength: 200
                    linkedin:
                      type: string
                      maxLength: 200
                    website:
                      type: string
                      maxLength: 200
                    discord:
                      type: string
                      maxLength: 200
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Profile
      summary: Delete user profile
      description: Deletes the authenticated user's profile. Requires authentication.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/validator/validate:
    post:
      tags:
        - Validator
      summary: Validate a learner milestone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatorRequest"
      responses:
        "200":
          description: Milestone validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ValidatorResult"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/wallet/deploy:
    post:
      tags:
        - Wallet
      summary: Deploy a sponsored passkey smart wallet
      description: Deploys a PasskeyWallet contract instance controlled by the given
        secp256r1 WebAuthn public key. The learner pays nothing — the platform
        sponsors deployment. Returns a session token for the new wallet address,
        same as a wallet-connect login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credentialId
                - publicKey
              properties:
                credentialId:
                  type: string
                  description: Base64url-encoded WebAuthn credential ID
                publicKey:
                  type: string
                  description: Base64url-encoded 65-byte uncompressed SEC1 P-256 public key
                deviceLabel:
                  type: string
      responses:
        "201":
          description: Wallet deployed
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/wallet/{address}/signers/prepare:
    post:
      tags:
        - Wallet
      summary: Prepare a sponsored add_signer transaction
      description: Builds and simulates an add_signer call for the given wallet,
        returning a challenge that an already-registered passkey must sign to
        authorize enrolling the new device.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge to sign
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: Forbidden
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/wallet/{address}/signers/confirm:
    post:
      tags:
        - Wallet
      summary: Confirm and submit a prepared add_signer transaction
      description: Attaches a WebAuthn assertion (signed against the challenge from
        /prepare) to the pending transaction, submits it sponsored, and records
        the new device.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signer added
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: Forbidden
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/webhooks/horizon:
    post:
      tags:
        - Webhooks
      summary: Receive Stellar Horizon event notifications
      description: |
        Accepts signed webhook payloads from Horizon or a relay service.
        Returns 200 immediately and processes events asynchronously.
      parameters:
        - in: header
          name: X-Webhook-Signature
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of the raw body (`sha256=<hex>`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - type
                      - contract
                      - topic
                      - ledger
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      contract:
                        type: string
                      topic:
                        type: string
                      ledger:
                        oneOf:
                          - type: string
                          - type: number
                      value:
                        type: object
      responses:
        "200":
          description: Payload accepted for async processing
        "400":
          description: Invalid payload
        "401":
          description: Missing or invalid signature
        "503":
          description: Webhook secret not configured
