          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of reviews with aggregate stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
