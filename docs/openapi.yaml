  /api/onboarding/sponsor-account:
    post:
      tags:
        - Onboarding
      summary: Build a sponsored account-creation transaction for a zero-XLM learner
      description: >
        Builds a transaction that sponsors the reserve for a brand-new Stellar
        account (begin_sponsoring_future_reserves / create_account with
        startingBalance "0" / optional change_trust /
        end_sponsoring_future_reserves), signed by the platform sponsor. The
        learner must countersign the returned XDR in their own wallet before it
        can be submitted — the server never sees or holds the learner's secret
        key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - learnerAddress
              properties:
                learnerAddress:
                  type: string
                  description: The Stellar public key (G...) of a keypair the learner generated or
                    connected locally.
                withUsdcTrustline:
                  type: boolean
                  description: Include a sponsored USDC trustline. Defaults to true when a classic
                    USDC asset is configured.
      responses:
        "200":
          description: Sponsor-signed XDR ready for the learner to countersign
          content:
            application/json:
              schema:
                type: object
                properties:
                  xdr:
                    type: string
                  networkPassphrase:
                    type: string
                  reservesLockedStroops:
                    type: string
                  includesUsdcTrustline:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Sponsor account not configured
