openapi: 3.0.3
info:
  title: LearnVault API
  version: 1.0.0
  description: Backend API for LearnVault frontend and integrations.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
tags:
  - name: Health
    description: Server status endpoints
  - name: Auth
    description: Wallet authentication endpoints
  - name: Courses
    description: Course catalog endpoints
  - name: Enrollments
    description: Course enrollment endpoints
  - name: Governance
    description: Governance proposal endpoints
  - name: Scholarships
    description: Scholarship application endpoints
  - name: Scholars
    description: Scholar leaderboard endpoints
  - name: Validator
    description: Milestone validation endpoints
  - name: Admin
    description: Admin milestone management endpoints
  - name: Credentials
    description: Scholar credential endpoints
  - name: Events
    description: Event stream endpoints
  - name: Leaderboard
    description: Learner ranking endpoints
  - name: Streaks
    description: Learning streak and daily goal endpoints
  - name: Comments
    description: Proposal comment endpoints
  - name: Treasury
    description: Treasury statistics and activity endpoints
  - name: Upload
    description: IPFS file upload endpoints
  - name: Translations
    description: Course/lesson content translation, translator workspace, and
      glossary endpoints
  - name: Data Rights
    description: Learner export and account deletion endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ZodIssue:
      type: object
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          example: invalid_type
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          example:
            - walletAddress
        message:
          type: string
          example: Required
    ValidationErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ZodIssue"
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
          example: healthy
        db:
          type: string
          enum:
            - connected
            - disconnected
        uptime:
          type: number
          format: float
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        commitHash:
          type: string
        dbPool:
          type: object
          properties:
            totalConnections:
              type: integer
              nullable: true
            idleConnections:
              type: integer
              nullable: true
            waitingClients:
              type: integer
              nullable: true
          required:
            - totalConnections
            - idleConnections
            - waitingClients
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                responseTimeMs:
                  type: integer
                  nullable: true
                error:
                  type: string
              required:
                - status
                - responseTimeMs
            redis:
              type: object
              properties:
                status:
                  type: string
                responseTimeMs:
                  type: integer
                  nullable: true
                error:
                  type: string
                details:
                  type: string
              required:
                - status
                - responseTimeMs
            stellarHorizon:
              type: object
              properties:
                status:
                  type: string
                responseTimeMs:
                  type: integer
                  nullable: true
                url:
                  type: string
                error:
                  type: string
              required:
                - status
                - responseTimeMs
                - url
          required:
            - database
            - redis
            - stellarHorizon
      required:
        - status
        - db
        - uptime
        - timestamp
        - version
        - commitHash
        - dbPool
        - checks
    Course:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        level:
          type: string
        published:
          type: boolean
      required:
        - id
        - title
        - level
        - published
    Event:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        entityId:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - type
        - entityId
        - timestamp
    ValidatorRequest:
      type: object
      properties:
        courseId:
          type: string
        learnerAddress:
          type: string
        milestoneId:
          type: integer
          minimum: 0
      required:
        - courseId
        - learnerAddress
        - milestoneId
    ValidatorResult:
      allOf:
        - $ref: "#/components/schemas/ValidatorRequest"
        - type: object
          properties:
            approved:
              type: boolean
            validator:
              type: string
          required:
            - approved
            - validator
    Proposal:
      type: object
      properties:
        id:
          type: integer
        author_address:
          type: string
          example: GABCD123456789...
        title:
          type: string
        description:
          type: string
        amount:
          type: number
        votes_for:
          type: integer
        votes_against:
          type: integer
        status:
          type: string
          enum:
            - pending
            - approved
            - queued
            - rejected
        cancelled:
          type: boolean
        deadline:
          type: string
          format: date-time
      required:
        - id
        - author_address
        - title
        - status
    ScholarRanking:
      type: object
      properties:
        rank:
          type: integer
        address:
          type: string
        lrn_balance:
          type: number
        courses_completed:
          type: integer
      required:
        - rank
        - address
        - lrn_balance
        - courses_completed
    ScholarshipApplication:
      type: object
      properties:
        applicant_address:
          type: string
          minLength: 50
          maxLength: 56
        full_name:
          type: string
          minLength: 2
        course_id:
          type: string
          minLength: 2
        motivation:
          type: string
          minLength: 10
        evidence_url:
          type: string
          format: uri
        amount:
          type: number
          description: "Requested USDC amount (default: 1000)"
      required:
        - applicant_address
        - full_name
        - course_id
        - motivation
        - evidence_url
    CourseDetail:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        coverImage:
          type: string
          nullable: true
        track:
          type: string
        difficulty:
          type: string
          enum:
            - beginner
            - intermediate
            - advanced
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        studentsCount:
          type: integer
        prerequisites:
          type: array
          items:
            type: integer
        avgRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        languageServed:
          type: string
          enum:
            - en
            - es
            - fr
            - sw
          description: The content language actually returned.
        isTranslation:
          type: boolean
          description: True when languageServed is a published translation, not English.
        isFallback:
          type: boolean
          description: True when a non-English language was requested but no published
            translation exists, so English was served instead.
        isStale:
          type: boolean
          description: True when the served translation was made from an older revision of
            the English source. Still served — never silently hidden.
        translatorAddress:
          type: string
          nullable: true
          description: Wallet address credited for the served translation, or null for
            English/no translation.
        availableLanguages:
          type: array
          items:
            type: string
            enum:
              - es
              - fr
              - sw
          description: Languages with at least one published translation for this course
            (course- or lesson-level), regardless of staleness.
        translationCoverage:
          type: object
          properties:
            totalLessons:
              type: integer
            translatedLessons:
              type: integer
          description: How many of the course's lessons have a published translation in
            the requested language — lets a learner see partial coverage before
            committing.
      required:
        - id
        - slug
        - title
        - track
        - difficulty
        - published
    Lesson:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        content:
          type: string
        order:
          type: integer
        estimatedMinutes:
          type: integer
        isMilestone:
          type: boolean
        version:
          type: integer
        isLatest:
          type: boolean
        changeSummary:
          type: string
          nullable: true
        quiz:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              options:
                type: array
                items:
                  type: string
              correctIndex:
                type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        languageServed:
          type: string
          enum:
            - en
            - es
            - fr
            - sw
        isTranslation:
          type: boolean
        isFallback:
          type: boolean
        isStale:
          type: boolean
        translatorAddress:
          type: string
          nullable: true
      required:
        - id
        - courseId
        - title
        - content
        - order
    CourseTranslation:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        languageCode:
          type: string
          enum:
            - es
            - fr
            - sw
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - in_review
            - published
        translatorAddress:
          type: string
        reviewedByAddress:
          type: string
          nullable: true
        sourceVersion:
          type: integer
        isStale:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    LessonTranslation:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        orderIndex:
          type: integer
        languageCode:
          type: string
          enum:
            - es
            - fr
            - sw
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum:
            - draft
            - in_review
            - published
        translatorAddress:
          type: string
        reviewedByAddress:
          type: string
          nullable: true
        sourceVersion:
          type: integer
        isStale:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    GlossaryTerm:
      type: object
      properties:
        id:
          type: integer
        term:
          type: string
        note:
          type: string
          nullable: true
      required:
        - id
        - term
    TranslatorGrant:
      type: object
      properties:
        id:
          type: integer
        wallet_address:
          type: string
        language_code:
          type: string
          enum:
            - es
            - fr
            - sw
        granted_by:
          type: string
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    TranslatorQueue:
      type: object
      properties:
        untranslated:
          type: array
          items:
            type: object
            properties:
              courseSlug:
                type: string
              courseTitle:
                type: string
              orderIndex:
                type: integer
              lessonTitle:
                type: string
        inReview:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - course
                  - lesson
              courseSlug:
                type: string
              orderIndex:
                type: integer
                nullable: true
              title:
                type: string
              submittedAt:
                type: string
                format: date-time
        stale:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - course
                  - lesson
              courseSlug:
                type: string
              orderIndex:
                type: integer
                nullable: true
              title:
                type: string
              staleSinceVersion:
                type: integer
    GovernanceProposalInput:
      type: object
      properties:
        author_address:
          type: string
          minLength: 50
          maxLength: 56
          example: GABCD123456789...
        title:
          type: string
          minLength: 5
          maxLength: 200
        description:
          type: string
          minLength: 10
        requested_amount:
          type: string
          pattern: ^\d+(\.\d+)?$
          description: Numeric string representing requested USDC amount
        evidence_url:
          type: string
          format: uri
      required:
        - author_address
        - title
        - description
        - requested_amount
        - evidence_url
    GovernanceProposalCreated:
      type: object
      properties:
        proposal_id:
          type: integer
        tx_hash:
          type: string
      required:
        - proposal_id
        - tx_hash
    VotingPower:
      type: object
      properties:
        address:
          type: string
          example: GABCD123456789...
        gov_balance:
          type: string
          description: Raw governance token balance
        formatted:
          type: string
          description: Human-readable balance
          example: "100.50"
        can_vote:
          type: boolean
      required:
        - address
        - gov_balance
        - formatted
        - can_vote
    ScholarProfile:
      type: object
      properties:
        address:
          type: string
        lrn_balance:
          type: string
          description: Raw LRN token balance
        enrolled_courses:
          type: array
          items:
            type: string
        completed_milestones:
          type: integer
        pending_milestones:
          type: integer
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        joined_at:
          type: string
          format: date-time
      required:
        - address
        - lrn_balance
        - enrolled_courses
        - completed_milestones
        - pending_milestones
        - credentials
        - joined_at
    ScholarMilestone:
      type: object
      properties:
        id:
          type: string
        course_id:
          type: string
        milestone_id:
          type: integer
        status:
          type: string
          enum:
            - pending
            - verified
            - rejected
        evidence_url:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        tx_hash:
          type: string
          nullable: true
      required:
        - id
        - course_id
        - milestone_id
        - status
    Credential:
      type: object
      properties:
        token_id:
          type: integer
        course_id:
          type: string
        course_title:
          type: string
        issued_at:
          type: string
          format: date-time
        metadata_uri:
          type: string
        revoked:
          type: boolean
      required:
        - token_id
        - course_id
        - course_title
        - issued_at
        - metadata_uri
        - revoked
    CourseReview:
      type: object
      properties:
        id:
          type: integer
        course_id:
          type: string
        learner_address:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewText:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - course_id
        - learner_address
        - rating
        - created_at
    CourseImportRow:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        track:
          type: string
        difficulty:
          type: string
        description:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        published:
          type: boolean
      required:
        - title
        - slug
        - track
        - difficulty
    UserProfile:
      type: object
      properties:
        address:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        twitter:
          type: string
          nullable: true
        github:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - address
    ProfileStats:
      type: object
      properties:
        lrn_balance:
          type: string
        enrolled_courses:
          type: array
          items:
            type: string
        completed_milestones:
          type: integer
        pending_milestones:
          type: integer
  responses:
    BadRequestError:
      description: Bad request — validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
paths:
  /api/search:
    get:
      summary: Platform-wide full-text search
      description: |
        Ranked search across courses, lessons, wiki pages, forum threads and
        public scholar profiles using Postgres full-text search. Results are
        weighted title > body and include a <mark>-delimited snippet.
        Visibility rules apply: unpublished courses, unpublished wiki pages
        and profiles without a display name are never returned.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
          description: Search query (Postgres websearch syntax)
        - name: type
          in: query
          schema:
            type: string
            enum: [course, lesson, wiki, forum, profile]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque keyset cursor from a previous page's nextCursor
      responses:
        "200":
          description: Ranked results with an optional next-page cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [course, lesson, wiki, forum, profile]
                        id:
                          type: string
                        title:
                          type: string
                        snippet:
                          type: string
                          description: Excerpt with <mark>…</mark> around matches
                        url:
                          type: string
                  nextCursor:
                    type: string
                    nullable: true
        "400":
          description: Missing/oversized query or invalid type filter
        "429":
          description: Rate limited (30 requests per minute)

  /api/admin/rotate-key:
    post:
      summary: Rotate admin API key
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentKeyHash
                - reason
              properties:
                currentKeyHash:
                  type: string
                  description: Hash of current API key
                reason:
                  type: string
                  description: Reason for rotation (e.g., SCHEDULED, COMPROMISED)
      responses:
        "200":
          description: Key rotated successfully
  /api/admin/keys/active:
    get:
      summary: Get active API keys for admin
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active keys retrieved
  /api/admin/keys/rotation-status:
    get:
      summary: Check key rotation status
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rotation status
  /api/admin/keys/revoke:
    post:
      summary: Revoke an API key
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyHash
              properties:
                keyHash:
                  type: string
      responses:
        "200":
          description: Key revoked successfully
  /api/admin/milestones/pending:
    get:
      tags:
        - Admin
      summary: List all unverified milestone reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of pending milestone reports
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/admin/milestones/{id}:
    get:
      tags:
        - Admin
      summary: Get milestone report details and evidence
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Milestone report with audit log
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/admin/milestones/{id}/verify-oracle:
    post:
      tags:
        - Admin
      summary: Run GitHub proof-of-work verification for a milestone report
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Oracle verification result
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "502":
          description: GitHub API request failed
  /api/admin/milestones/{id}/approve:
    post:
      tags:
        - Admin
      summary: Approve a milestone report and trigger contract call
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Milestone approved
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Report already processed
  /api/admin/milestones/{id}/reject:
    post:
      tags:
        - Admin
      summary: Reject a milestone report with a reason
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Milestone rejected
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Report already processed
  /api/milestones/submit:
    post:
      tags:
        - Milestones
      summary: Scholar submits a milestone report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scholarAddress
                - course_id
                - milestone_id
              properties:
                scholarAddress:
                  type: string
                course_id:
                  type: string
                milestone_id:
                  type: integer
                evidenceGitHub:
                  type: string
                evidenceIpfsCid:
                  type: string
                evidenceDescription:
                  type: string
      responses:
        "201":
          description: Report submitted
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: Report already submitted for this milestone
        "429":
          description: Rate limit exceeded
  /api/milestones/resubmit:
    post:
      tags:
        - Milestones
      summary: Scholar resubmits a rejected milestone report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                evidenceGithub:
                  type: string
                evidenceIpfsCid:
                  type: string
                evidenceDescription:
                  type: string
      responses:
        "200":
          description: Report resubmitted
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          description: Report not found
        "429":
          description: Rate limit exceeded
  /api/admin/validators/analytics:
    get:
      tags:
        - Admin
      summary: Get per-validator milestone review performance analytics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Validator analytics and queue alert status
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /api/anchors:
    get:
      tags:
        - Anchors
      summary: List allowlisted anchors, optionally filtered by country
      parameters:
        - in: query
          name: country
          schema:
            type: string
          description: ISO 3166-1 alpha-2 country code
      responses:
        "200":
          description: Allowlisted anchors serving the given country (or all, if omitted)
  /api/anchors/{domain}/auth-challenge:
    get:
      tags:
        - Anchors
      summary: Fetch a SEP-10 challenge from the anchor for the learner's wallet to sign
      description: >
        Proxies the anchor's own WEB_AUTH_ENDPOINT. The learner signs the
        returned transaction locally (their wallet, never this server) and
        submits it via POST /api/anchors/{domain}/auth.
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: query
          name: account
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge transaction XDR
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          description: Anchor domain is not on the allowlist
  /api/anchors/{domain}/auth:
    post:
      tags:
        - Anchors
      summary: Submit the learner-signed SEP-10 challenge to the anchor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signedTransactionXdr
              properties:
                signedTransactionXdr:
                  type: string
      responses:
        "200":
          description: Anchor's SEP-10 token
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          description: Anchor domain is not on the allowlist
  /api/anchors/{domain}/quote:
    get:
      tags:
        - Anchors
      summary: Get a price quote from the anchor's SEP-38 quote server
      description: >
        Returns an indicative price if no anchor auth token is supplied, or a
        firm, expiring quote (SEP-38 POST /quote) when an `Authorization: Bearer
        <anchor token>` header is present.
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: query
          name: sell
          required: true
          schema:
            type: string
        - in: query
          name: buy
          required: true
          schema:
            type: string
        - in: query
          name: amount
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Indicative price or firm quote
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          description: Anchor domain is not on the allowlist
  /api/anchors/{domain}/withdraw:
    post:
      tags:
        - Anchors
      summary: Start an interactive SEP-24 withdrawal
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetCode
                - assetOut
                - amount
                - anchorToken
              properties:
                assetCode:
                  type: string
                  description: e.g. USDC
                assetOut:
                  type: string
                  description: e.g. NGN
                amount:
                  type: string
                quoteId:
                  type: string
                  description: SEP-38 firm quote id, if one was obtained
                anchorToken:
                  type: string
                  description: Anchor's own SEP-10 token
      responses:
        "201":
          description: Interactive withdrawal started
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: Unauthorized
        "404":
          description: Anchor domain is not on the allowlist
  /api/anchors/{domain}/withdrawals/{transactionId}/reconcile:
    post:
      tags:
        - Anchors
      summary: Re-poll the anchor for a withdrawal's current status and persist it
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: path
          name: transactionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - anchorToken
              properties:
                anchorToken:
                  type: string
      responses:
        "200":
          description: Reconciled withdrawal row
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: Unauthorized
        "404":
          description: Withdrawal not found for this learner, or anchor domain not
            allowlisted
  /api/anchors/withdrawals:
    get:
      tags:
        - Anchors
      summary: The authenticated learner's anchor withdrawal history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Withdrawal rows for this learner, most recent first
        "401":
          description: Unauthorized
  /api/me/bookmarks:
    get:
      tags:
        - Bookmarks
      summary: List the authenticated learner's bookmarked courses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookmarks fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        bookmark_id:
                          type: integer
                        course_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        "401":
          description: Unauthorized
    post:
      tags:
        - Bookmarks
      summary: Bookmark a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - course_id
              properties:
                course_id:
                  type: string
      responses:
        "200":
          description: Bookmark already existed (idempotent)
        "201":
          description: Bookmark created
        "400":
          description: Validation error
        "401":
          description: Unauthorized
  /api/me/bookmarks/{courseId}:
    delete:
      tags:
        - Bookmarks
      summary: Remove a bookmark (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Bookmark removed (or did not exist)
        "400":
          description: Validation error
        "401":
          description: Unauthorized
  /api/proposals/{proposalId}/comments:
    get:
      summary: Fetch comments for a proposal
      tags:
        - Comments
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
  /api/comments:
    post:
      summary: Post a new comment
      tags:
        - Comments
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Comment created
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          description: Rate limited
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/comments/{id}:
    patch:
      summary: Edit own comment
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
