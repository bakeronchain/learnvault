  /api/scholarships/apply:
    post:
      tags:
        - Scholarships
      summary: Submit a scholarship application
      description: >
        Creates a scholarship proposal on-chain via the ScholarshipTreasury
        contract

        and records it in the database. Generates a 3-milestone program
        automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipApplication"
            example:
              applicant_address: GABCD123456789...
              full_name: Jane Doe
              course_id: stellar-basics
              motivation: I want to learn blockchain development to build solutions for my
                community.
              evidence_url: https://github.com/janedoe/portfolio
              amount: 1000
      responses:
        "201":
          description: Scholarship application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id:
                    type: integer
                    description: Database ID of the created proposal
                  tx_hash:
                    type: string
                    description: On-chain transaction hash
                  simulated:
                    type: boolean
                    description: Whether the transaction was simulated (no secret key configured)
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: object
                    description: Field-level validation errors
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/scholarships/{id}/contribute:
    post:
      tags:
        - Scholarships
      summary: Co-fund an approved scholarship proposal
      description: |
        Records a verified on-chain USDC deposit against an approved or queued
        proposal. The Stellar transaction is confirmed via Horizon before any
        database write occurs.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Proposal ID to co-fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - donor_address
                - amount
                - tx_hash
              properties:
                donor_address:
                  type: string
                  description: Stellar G-address of the donor (must match JWT)
                amount:
                  type: number
                  description: USDC amount contributed
                tx_hash:
                  type: string
                  description: 64-character hex hash of the on-chain deposit transaction
      responses:
        "200":
          description: Contribution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_funding:
                    type: number
                  fully_funded:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: Transaction already recorded or proposal not co-fundable
        "422":
          description: On-chain verification failed
