                  avgRating:
                    type: number
                    nullable: true
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Reviews
      summary: Submit a review for a course
      description: Creates a review for a published course. Requires the learner to be
        enrolled. One review per learner per course.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
          description: Course numeric ID or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                reviewText:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseReview"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: Not enrolled in course
