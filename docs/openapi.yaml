            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Comment updated
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete own comment (soft delete)
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/comments/{id}/vote:
    put:
      summary: Upvote or downvote a comment
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - upvote
                    - downvote
      responses:
        "200":
          description: Vote recorded
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/comments/{id}/pin:
    put:
      summary: Pin a comment (proposal author only)
      tags:
        - Comments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinned
              properties:
                pinned:
                  type: boolean
      responses:
        "200":
          description: Pin updated
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/courses:
    get:
      tags:
        - Courses
      summary: List courses
      description: >
        Returns paginated, published courses. Every course states which content
        language was actually served: `lang`/`Accept-Language` resolve a
        published translation when one exists, and the response is honest when
        it falls back to English or when the served translation is stale (its
        source has since changed).
      parameters:
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - en
              - es
              - fr
              - sw
          description: >
            Requested content language. Falls back to the Accept-Language
            header, then to English. Independent of any UI locale.
        - in: query
          name: track
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: difficulty
          schema:
            type: string
            enum:
              - beginner
              - intermediate
              - advanced
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
        - in: query
          name: includeUnpublished
          schema:
            type: boolean
          description: Admin-only; requires bearer auth or x-api-key.
      responses:
        "200":
          description: Paginated course list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourseDetail"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/courses/{idOrSlug}:
    get:
      tags:
        - Courses
      summary: Get a course with its lessons
      description: >
        Returns course metadata and its version-pinned lessons. Content language
        resolves the same way as the course list: a published translation for
        `lang`, falling back to English with `isFallback: true` when none
        exists. `translationCoverage` reports how many of the course's lessons
        are available in the requested language, so a learner can see partial
        coverage before committing.
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - en
              - es
              - fr
              - sw
        - in: query
          name: learner_address
          schema:
            type: string
          description: Pins lesson content to the learner's enrolled content_version.
      responses:
        "200":
          description: Course with nested, language-resolved lessons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CourseDetail"
                  - type: object
                    properties:
                      enrollmentContentVersion:
                        type: integer
                        nullable: true
                      latestContentVersion:
                        type: integer
                      hasUpdatedContent:
                        type: boolean
                      lessons:
                        type: array
                        items:
                          $ref: "#/components/schemas/Lesson"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/courses/{idOrSlug}/lessons/{id}:
    get:
      tags:
        - Courses
      summary: Get a single lesson
      description: Returns one lesson by its numeric id, language-resolved the same
        way as course lessons.
      parameters:
        - in: path
          name: idOrSlug
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: lang
          schema:
            type: string
            enum:
              - en
              - es
              - fr
              - sw
      responses:
        "200":
          description: Lesson content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/credentials/{address}:
    get:
      tags:
        - Credentials
      summary: List credentials for a learner address
      description: Returns all ScholarNFT credentials minted for the provided Stellar
        address, including revoked items.
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
          description: Scholar's Stellar wallet address
      responses:
        "200":
          description: Credentials fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        token_id:
                          type: integer
                          example: 1
                        course_id:
                          type: string
                          example: stellar-basics
                        metadata_uri:
                          type: string
                          nullable: true
                          example: ipfs://bafkrei...
                        minted_at:
                          type: string
                          format: date-time
                          example: 2026-03-26T10:30:00Z
                        revoked:
                          type: boolean
                          example: false
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/credentials/metadata:
    post:
      tags:
        - Credentials
      summary: Generate and upload NFT metadata for a course completion credential
      description: |
        Creates ERC-721/ERC-1155 compliant metadata for a ScholarNFT credential,
        uploads it to IPFS via Pinata, and returns the ipfs:// URI for use in
        scholar_nft.mint().
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - course_id
                - learner_address
                - completed_at
              properties:
                course_id:
                  type: string
                  description: Course identifier (e.g., "stellar-basics")
                  example: stellar-basics
                learner_address:
                  type: string
                  description: Stellar address of the learner
                  example: GABC123...XYZ789
                completed_at:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp of course completion
                  example: 2026-03-26T10:30:00Z
      responses:
        "201":
          description: Metadata created and uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      metadata_uri:
                        type: string
                        description: IPFS URI for use in scholar_nft.mint()
                        example: ipfs://bafkreiabcdef1234567890ghijklmnopqrstuvwxyz
                      gateway_url:
                        type: string
                        description: HTTP gateway URL for viewing metadata
                        example: https://gateway.pinata.cloud/ipfs/bafkreiabcdef1234567890ghijklmnopqrstuvwxyz
                      metadata:
                        type: object
                        description: The generated metadata object
                        properties:
                          name:
                            type: string
                            example: Introduction to Stellar & Soroban — Course Completion
                          description:
                            type: string
                            example: Issued to learners who complete all milestones in Introduction to
                              Stellar & Soroban
                          image:
                            type: string
                            example: ipfs://bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
                          attributes:
                            type: array
                            items:
                              type: object
                              properties:
                                trait_type:
                                  type: string
                                value:
                                  type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Course not found
                  message:
                    type: string
                    example: "No course found with id: invalid-course"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: IPFS pinning service not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service unavailable
                  message:
                    type: string
                    example: IPFS pinning service is not configured. Please contact the
                      administrator.
  /api/donors/{address}/impact:
    get:
      tags:
        - Donors
      summary: Get donor impact statistics
      description: Returns impact metrics for a specific donor including total
        donated, scholars funded, milestones completed by funded scholars, and
        average completion rate
      parameters:
        - in: path
          name: address
          required: true
