        - LRN
      summary: Burn LRN tokens on-chain
      description: >
        Verifies the caller holds sufficient LRN on the learn_token Soroban
        contract,

        invokes `burn`, persists the transaction hash, and emits a
        `token_burned` SSE event.

        When the server key does not match the wallet, pass a wallet-signed XDR
        as

        `signed_transaction`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  description: LRN amount in atomic units (7 decimals)
                  example: "10000000"
                signed_transaction:
                  type: string
                  description: Optional wallet-signed Soroban transaction XDR
      responses:
        "201":
          description: Burn submitted and recorded
          content:
            application/json:
